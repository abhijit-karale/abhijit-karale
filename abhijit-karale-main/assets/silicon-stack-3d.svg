<polygon points="360.0,258.0 585.2,388.0 360.0,518.0 134.8,388.0" fill="#070305" opacity="0.6" filter="url(#drop_blur)"/>
<polygon points="152.2,364.0 360.0,484.0 360.0,500.0 152.2,380.0" fill="#14060E" stroke="#451126" stroke-width="0.8"/>
<polygon points="567.8,364.0 360.0,484.0 360.0,500.0 567.8,380.0" fill="#0F040A" stroke="#451126" stroke-width="0.8"/>
<polygon points="360.0,244.0 567.8,364.0 360.0,484.0 152.2,364.0" fill="url(#top_l1)" stroke="#701A3D" stroke-width="1.2"/>
    <polyline points="360.0,304.0 412.0,334.0 360.0,364.0 412.0,394.0" fill="none" stroke="#C77B9B" stroke-width="1.2" opacity="0.6"/>
