<polygon points="360.0,24.0 567.8,144.0 360.0,264.0 152.2,144.0" fill="url(#top_l3)" stroke="#E5B5C7" stroke-width="1.2"/>
    <polygon points="360.0,92.0 446.6,142.0 360.0,192.0 273.4,142.0" fill="none" stroke="#64FFDA" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#neon_glow)"/>
    <circle cx="360.0" cy="92.0" r="7" fill="#14060E" stroke="#64FFDA" stroke-width="1.2"/>
    <text x="360.0" y="95.0" fill="#64FFDA" class="ak-mono" font-size="7" font-weight="800" text-anchor="middle">SEQ</text>
    <circle cx="446.6" cy="142.0" r="7" fill="#14060E" stroke="#64FFDA" stroke-width="1.2"/>
