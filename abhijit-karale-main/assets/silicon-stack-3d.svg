    <text x="273.4" y="145.0" fill="#64FFDA" class="ak-mono" font-size="7" font-weight="800" text-anchor="middle">SCB</text>
    <polygon points="360.0,118.0 398.1,140.0 360.0,162.0 321.9,140.0" fill="#701A3D" stroke="#64FFDA" stroke-width="1.2"/>
    <text x="360.0" y="142.0" fill="#FFFFFF" class="ak-mono" font-size="8" font-weight="800" text-anchor="middle">SVA PROOF</text>
  </g>

    <!-- CARD 3 (TOP LAYER) -->
    <g transform="translate(550, 154.0)">
      <line x1="-30" y1="50" x2="0" y2="50" stroke="#64FFDA" stroke-width="1.2" stroke-dasharray="3 3"/>
      <circle cx="-30" cy="50" r="3" fill="#64FFDA"/>
      <rect x="0" y="0" width="370" height="100" rx="8" fill="#180A13" stroke="#64FFDA" stroke-width="1.2" opacity="0.95"/>
      <rect x="12" y="12" width="70" height="18" rx="4" fill="#701A3D"/>
      <text x="47" y="24" fill="#64FFDA" class="ak-mono txt-tag" text-anchor="middle">LAYER 03</text>
